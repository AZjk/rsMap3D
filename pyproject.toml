[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsMap3D"
version = "1.3.1"
description = "Python program to map x-ray diffraction data into a reciprocal space map"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "John Hammonds"},
    {name = "Christian Schleputz"},
]
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "vtk",
    "numpy",
    "xrayutilities",
    "h5py",
    "hdf5plugin",
    "matplotlib",
    "spec2nexus",
    "pillow",
]

[project.optional-dependencies]
xpcs = ["pyepics"]
dev = ["pytest", "ruff"]

[project.scripts]
rsMap3D = "rsMap3D.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsMap3D = ["resources/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "scripts/paraview",
    "scripts/powderscan_newRSM3D.py",
    "scripts/powderscan_win.py",
    "scripts/mapSpecAngleScan.py",
    "scripts/mapSpecAngleScan_v2.py",
    "src/rsMap3D/mappers/output/vti_to_imstack.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90"]
ignore = ["E402", "E501", "C901", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["rsMap3D"]

[tool.ruff.lint.per-file-ignores]
"scripts/paraview/*" = ["F403", "F405"]
"scripts/powderscan_newRSM3D.py" = ["E", "F", "W", "I", "UP", "B", "C90"]
"scripts/powderscan_win.py" = ["E", "F", "W", "I", "UP", "B", "C90"]
"scripts/mapSpecAngleScan.py" = ["E", "F", "W", "I", "UP", "B", "C90"]
"scripts/mapSpecAngleScan_v2.py" = ["E", "F", "W", "I", "UP", "B", "C90"]
"src/rsMap3D/mappers/output/vti_to_imstack.py" = ["E", "F", "W", "I", "UP", "B", "C90"]
